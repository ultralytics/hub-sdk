# Ultralytics Actions https://github.com/ultralytics/actions
# This workflow formats code and documentation in PRs to Ultralytics standards

name: Ultralytics Actions

on:
  issues:
    types: [opened]
  pull_request:
    branches: [main]
    types: [opened, closed, synchronize, review_requested]

permissions:
  contents: write # Modify code in PRs
  pull-requests: write # Add comments and labels to PRs
  issues: write # Add comments and labels to issues

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ultralytics Actions
        uses: ultralytics/actions@main
        with:
          token: ${{ secrets._GITHUB_TOKEN || secrets.GITHUB_TOKEN }} # Auto-generated token
          labels: true # Auto-label issues/PRs using AI
          python: true # Format Python with Ruff and docformatter
          prettier: true # Format YAML, JSON, Markdown, CSS
          spelling: true # Check spelling with codespell
          links: false # Check broken links with Lychee
          summary: true # Generate AI-powered PR summaries
          openai_api_key: ${{ secrets.OPENAI_API_KEY }} # Powers PR summaries, labels and comments
          brave_api_key: ${{ secrets.BRAVE_API_KEY }} # Used for broken link resolution
          first_issue_response: |
            👋 Hello @${{ github.actor }}. Ultralytics HUB and HUB-SDK were deprecated and shut down on July 31, 2026, and have been fully replaced by [Ultralytics Platform](https://platform.ultralytics.com).

            HUB APIs and the HUB-to-Platform migration service are no longer available. HUB-SDK only communicates with retired HUB APIs and is not compatible with the Platform API. Legacy HUB API keys also do not work with Platform.

            Create a new Platform account and Platform API key for current workflows. Platform is free to start and provides major improvements including regional data residency, Smart Annotation, cloud and remote training, browser prediction, 20 export formats, monitored endpoints in 42 global regions, and a full REST API.

            Please use these current resources:
            - [**Platform Quickstart**](https://docs.ultralytics.com/platform/quickstart). Create an account, upload data, train, and deploy.
            - [**Platform API Keys**](https://docs.ultralytics.com/platform/account/api-keys). Create a new key for remote training, inference, and automation.
            - [**Platform REST API**](https://docs.ultralytics.com/platform/api). Replace legacy HUB-SDK integrations.

            The retired HUB service cannot be restored through issues or pull requests, and new HUB-SDK features are not accepted. Submit current product feedback from the **Help** page in Platform.
